name: Verify and deploy Agila

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agila-website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked API dependencies
        run: npm ci --prefix api

      - name: Audit dependency tree
        run: npm audit --audit-level=low

      - name: Audit API dependency tree
        run: npm audit --prefix api --audit-level=low

      - name: Lint source
        run: npm run lint

      - name: Build and test rendered site
        run: npm test

      - name: Install browser for capability-system QA
        run: npx playwright install --with-deps chromium

      - name: Test interactive capability system
        run: npm run test:browser

      - name: Test contact API
        run: npm test --prefix api

      - name: Check whitespace errors
        run: git diff --check

  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AZURE_STATIC_WEB_APPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out validated source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build static production site
        run: npm run build

      - name: Require deployment credentials
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          test -n "$AZURE_STATIC_WEB_APPS_API_TOKEN"

      - name: Deploy Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: out
          api_location: api
          skip_app_build: true

      - name: Verify configured production URL
        if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --location --retry 5 --retry-all-errors "$PRODUCTION_URL"

      - name: Verify contact API is loaded
        if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-all-errors "$PRODUCTION_URL/api/contact")"
          test "$status" = "405"
